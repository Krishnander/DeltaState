# Configuration for Options Microstructure Research Engine

project:
  name: "options-microstructure-research"
  version: "0.1.0"

universe:
  target: "NIFTY"
  indices: ["NIFTY"]
  extended_indices: ["BANKNIFTY", "FINNIFTY"]

data_ingestion:
  start_date: "2015-01-01"
  end_date: null  # Null defaults to current date
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  retry:
    max_attempts: 3
    backoff_delays: [5, 15, 45]  # seconds

  http:
    timeout: 30
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

logging:
  level: "INFO"
  log_file: "data_ingestion.log"
