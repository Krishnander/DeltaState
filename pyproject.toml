[tool.poetry]
name = "options-microstructure-research"
version = "0.1.0"
description = "Quantitative research engine for Indian equity and options market microstructure"
authors = ["Quant Research Team <quant@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
pyarrow = ">=14.0.0"
pyyaml = ">=6.0"
requests = ">=2.31.0"
tenacity = ">=8.2.0"
nselib = ">=2.0.0"
scipy = ">=1.10.0"
tqdm = ">=4.66.0"
indiaopt = ">=0.1.0"
transformers = ">=4.38.0"
datasets = ">=2.18.0"
hmmlearn = ">=0.3.0"
scikit-learn = ">=1.3.0"
nsefin = ">=0.1.5"
jugaad-data = ">=0.35.5"
statsmodels = ">=0.14.0"
vectorbt = ">=1.1.0"
quantstats = ">=0.0.80"
plotly = "<6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
